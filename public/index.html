
<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no">

    <title>Balloons</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
        }

        canvas {
            display: block;
            touch-action: none;
        }

        .overlay {
            position: fixed;
            top: 16px;
            left: 16px;
            display: flex;
            align-items: stretch;
            gap: 10px;
            z-index: 10;
            pointer-events: none;
        }

        .card {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 52px;
            padding: 10px 18px;

            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            border: 1px solid rgba(255, 255, 255, 0.65);
            border-radius: 14px;

            box-shadow:
                0 4px 16px rgba(30, 30, 60, 0.08),
                0 1px 3px rgba(30, 30, 60, 0.05);

            pointer-events: auto;
        }

        .counter-card {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            min-width: 110px;
            gap: 2px;
        }

        .counter-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #77768c;
        }

        #counter {
            font-size: 23px;
            font-weight: 750;
            line-height: 1.2;
            color: #4930b0;
            font-variant-numeric: tabular-nums;
        }

        .reset-card {
            padding: 5px;
        }

        #reset {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            height: 42px;
            padding: 0 18px;

            border: 0;
            border-radius: 10px;

            background: #6246ea;
            color: white;

            font: inherit;
            font-size: 13px;
            font-weight: 650;

            cursor: pointer;
            touch-action: manipulation;

            transition:
                background 150ms ease,
                transform 150ms ease,
                box-shadow 150ms ease;
        }

        #reset:hover {
            background: #5134d4;
            box-shadow: 0 3px 10px rgba(98, 70, 234, 0.25);
        }

        #reset:active {
            transform: scale(0.96);
        }

        #reset:focus-visible {
            outline: 3px solid rgba(98, 70, 234, 0.35);
            outline-offset: 3px;
        }

        @media (max-width: 480px) {
            .overlay {
                top: 10px;
                left: 10px;
                gap: 8px;
            }

            .card {
                border-radius: 12px;
            }

            .counter-card {
                min-width: 95px;
                padding: 8px 12px;
            }
        }
    </style>
</head>

<body>
    <canvas id="app"></canvas>

    <div class="overlay">
        <div class="card counter-card">
            <span class="counter-label">Balloons</span>
            <span id="counter">0</span>
        </div>

        <div class="card reset-card">
            <button id="reset" type="button">
                <svg width="16" height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true">
                    <path d="M3 12a9 9 0 1 0 3-6.7" />
                    <path d="M3 3v6h6" />
                </svg>
                Reset
            </button>
        </div>
    </div>

    <script src="/app.js"></script>
</body>

</html>
