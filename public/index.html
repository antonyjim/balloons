<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/play-session.css">

    <meta name="theme-color" content="#b8dcf5">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Balloons">


    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v2.png">
    <link rel="icon" href="/favicon.ico">
    <title>Balloons</title>

    <style>
        .simple-mode .counter-card,
        .simple-mode .sketch-button,
        .simple-mode .puzzle-button,
        .simple-mode .matching-button,
        .simple-mode #object-picker,
        .simple-mode .background-picker { display: none !important; }
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: pan-y;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        canvas {
            display: block;
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
            -webkit-user-select: none;
            background: transparent
        }

        [hidden] { display: none !important; }
        #sketchpad-view, #matching-view, #puzzle-view { position: fixed; inset: 0; z-index: 20; }

        #background {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        #ground {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: clamp(36px, 8vh, 72px);
            z-index: 0;
            pointer-events: none;
            border-top: 3px solid #44372f;
            background-color: #bd9565;
            background-image: radial-gradient(ellipse at 18px 20px, #e2bf86 0 6px, transparent 7px), radial-gradient(ellipse at 65px 40px, #97734e 0 4px, transparent 5px), linear-gradient(#e5c58d 0 9px, #bd9565 9px);
            background-repeat: repeat;
            background-size: 96px 60px, 112px 60px, auto;
        }

        #app {
            position: fixed;
            inset: 0;
            z-index: 1;
            background: transparent;
        }


        #shared-toolbar { z-index: 50; }
        #shared-toolbar [hidden] { display: none !important; }
        #shared-toolbar.menu-collapsed .counter-card,
        #shared-toolbar.menu-collapsed .reset-card > :not(#exit-simple-mode) { display: none !important; }
        #shared-configuration { border-top: 1px solid #d9d4e6; margin-top: 10px; padding-top: 4px; }
        #shared-configuration label { display: block; margin: 8px 0; font: 13px system-ui; }
        #shared-configuration h3 { font: 600 14px system-ui; margin: 10px 0; }
        .overlay {
            position: fixed;
            top: 16px;
            left: 16px;
            display: flex;
            align-items: stretch;
            flex-wrap: wrap;
            max-width: calc(100vw - 32px);
            gap: 10px;
            z-index: 10;
            touch-action: none;
            user-select: none;
        }

        .card {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 52px;
            padding: 10px 18px;

            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            border: 1px solid rgba(255, 255, 255, 0.65);
            border-radius: 14px;

            box-shadow:
                0 4px 16px rgba(30, 30, 60, 0.08),
                0 1px 3px rgba(30, 30, 60, 0.05);

            pointer-events: auto;
        }

        .counter-card {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            min-width: 110px;
            gap: 2px;
        }

        .counter-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #77768c;
        }

        #counter {
            font-size: 23px;
            font-weight: 750;
            line-height: 1.2;
            color: #4930b0;
            font-variant-numeric: tabular-nums;
        }

        .reset-card {
            gap: 5px;
            padding: 5px;
        }

        .action-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            height: 42px;
            padding: 0 18px;

            border: 0;
            border-radius: 10px;

            background: #6246ea;
            color: white;

            font: inherit;
            font-size: 13px;
            font-weight: 650;

            cursor: pointer;
            touch-action: manipulation;

            transition:
                background 150ms ease,
                transform 150ms ease,
                box-shadow 150ms ease;
        }

        .action-button:hover {
            background: #5134d4;
            box-shadow: 0 3px 10px rgba(98, 70, 234, 0.25);
        }

        .action-button:active {
            transform: scale(0.96);
        }

        .action-button:focus-visible {
            outline: 3px solid rgba(98, 70, 234, 0.35);
            outline-offset: 3px;
        }

        .object-picker { position: relative; }
        #object-type { padding: 0 10px; gap: 4px; }
        #object-type-icon { background: rgb(250, 250, 250); border-radius: 5px; }
        #object-menu {
            position: absolute;
            top: calc(100% + 10px);
            left: 0;
            min-width: 186px;
            padding: 6px;
            border: 1px solid #e4ddfa;
            border-radius: 14px;
            background: #fff;
            box-shadow: 0 8px 28px rgba(49, 27, 112, 0.2);
        }
        #object-menu[hidden] { display: none; }
        #object-menu button {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            min-height: 44px;
            padding: 8px 10px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: #4930b0;
            font: inherit;
            font-size: 13px;
            text-align: left;
            cursor: pointer;
        }
        #object-menu button:hover, #object-menu button:focus-visible { background: #f1edff; }
        #object-menu button:focus-visible { outline: 2px solid #6246ea; outline-offset: -2px; }
        #object-menu button[aria-checked="true"] { background: #e9e2ff; font-weight: 650; }
        #object-menu button[aria-checked="true"]::after { content: ''; margin-left: auto; width: 6px; height: 6px; border-radius: 50%; background: #6246ea; }

        .draw-button {
            display: grid;
            place-items: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.85);
            color: #7657ec;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
            text-decoration: none;
        }

        .background-picker { position: relative; }
        #background-toggle { width: auto; padding: 0 14px; }
        #background-menu {
            position: absolute; top: calc(100% + 10px); right: 0;
            width: min(260px, calc(100vw - 32px)); padding: 10px; border: 1px solid #e4ddfa;
            border-radius: 14px; background: white; color: #4930b0;
            box-shadow: 0 8px 28px rgba(49,27,112,.2);
        }
        #background-menu button { width: 100%; min-height: 40px; padding: 8px; background: #f4f0ff; border: 0; border-radius: 8px; color: inherit; cursor: pointer; font: inherit; font-size: 13px; margin-bottom: 5px; }
        #background-menu button:disabled { opacity: .45; cursor: default; }
        #background-menu button:focus-visible { outline: 2px solid #6246ea; }
        #background-menu .sky-options { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
        #background-menu img { display: block; width: 100%; height: 48px; object-fit: cover; border-radius: 5px; margin-bottom: 4px; }
        #background-menu small, #background-status { display: block; font-size: 12px; line-height: 1.5; }

        .sketch-button { text-decoration: none; }

        .sketch-button svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @media (max-width: 480px) {
            #shared-toolbar { z-index: 50; }
        #shared-toolbar [hidden] { display: none !important; }
        #shared-toolbar.menu-collapsed .counter-card,
        #shared-toolbar.menu-collapsed .reset-card > :not(#exit-simple-mode) { display: none !important; }
        #shared-configuration { border-top: 1px solid #d9d4e6; margin-top: 10px; padding-top: 4px; }
        #shared-configuration label { display: block; margin: 8px 0; font: 13px system-ui; }
        #shared-configuration h3 { font: 600 14px system-ui; margin: 10px 0; }
        .overlay {
                top: 10px;
                left: 10px;
                gap: 8px;
            }

            .card {
                border-radius: 12px;
            }

            .counter-card {
                min-width: 95px;
                padding: 8px 12px;
            }
        }

        body { --menu-accent: #6246ea; --menu-ink: #4930b0; --menu-surface: #faf8ff; --menu-soft: #eee8f8; --menu-border: #d8d3e3; }
        body[data-app="matching"] { --menu-accent: #36756e; --menu-ink: #35444d; --menu-surface: #fff6df; --menu-soft: #d5ebe0; --menu-border: #b5cfc0; }
        body[data-app="sketchpad"] { --menu-accent: #9b5884; --menu-ink: #625579; --menu-surface: #f4f3f9; --menu-soft: #f2e1ef; --menu-border: #d7cde4; }
        body[data-app="puzzle"] { --menu-accent: #507751; --menu-ink: #344559; --menu-surface: #f8f3e9; --menu-soft: #e2e8df; --menu-border: #c7d1cb; }
        #shared-toolbar .card { backdrop-filter: none; -webkit-backdrop-filter: none; background: var(--menu-surface); color: var(--menu-ink); }
        #shared-toolbar .action-button { background: var(--menu-accent); color: white; }
        #shared-toolbar #exit-simple-mode { width: 40px; padding: 0; margin-left: 8px; flex-shrink: 0; background: transparent; color: var(--menu-ink); opacity: .65; }
        #shared-toolbar #exit-simple-mode:hover, #shared-toolbar #exit-simple-mode:focus-visible { background: var(--menu-soft); opacity: 1; }
        #toolbar-collapse-label { display: none; }
        #shared-toolbar #exit-simple-mode svg { transition: transform .15s; }
        #shared-toolbar.menu-collapsed #exit-simple-mode svg { transform: rotate(180deg); }
        #shared-toolbar #background-menu, #shared-toolbar #object-menu { background: var(--menu-surface); color: var(--menu-ink); border-color: var(--menu-border); }
        #shared-toolbar #background-menu button, #shared-toolbar #object-menu button:hover,
        #shared-toolbar #object-menu button[aria-checked="true"] { background: var(--menu-soft); color: var(--menu-ink); }
        #shared-toolbar #play-timer, #shared-toolbar #counter { color: var(--menu-accent); }
        #shared-toolbar #shared-configuration { border-color: var(--menu-border); }
        #shared-toolbar button:focus-visible, #shared-toolbar a:focus-visible { outline-color: var(--menu-accent); }
        .play-settings { background: var(--menu-surface); color: var(--menu-ink); border-color: var(--menu-border); }
        .play-settings .play-settings-actions button, .play-settings .timer-presets button { background: var(--menu-soft); color: var(--menu-ink); }
        #menu-unlock-progress { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60px; height: 60px; z-index: 11000; pointer-events: none; color: var(--menu-ink); opacity: .65; }
        #menu-unlock-progress svg { display: block; width: 100%; height: 100%; filter: drop-shadow(0 0 3px var(--menu-surface)); }
        .unlock-quarters { stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 25 18; }
        .unlock-quarters path { transition: opacity .15s; }
        .unlock-quarters [data-complete="true"] { opacity: .08; }
        .unlock-icon { stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
        @media (prefers-reduced-motion: reduce) { .unlock-quarters path { transition: none; } }
        html { zoom: var(--page-scale, 1); }
        html, body { width: var(--page-width, 100%); height: var(--page-height, 100%); }
        #sketchpad-view, #matching-view, #puzzle-view, #app, canvas.mystify-screen { width: var(--page-width, 100vw); height: var(--page-height, 100dvh); }
        #shared-toolbar { max-width: calc(var(--page-width, 100vw) - 32px); }
        #shared-toolbar .reset-card { flex-wrap: wrap; justify-content: flex-start; min-width: 0; max-width: 100%; }
        #shared-toolbar .reset-card > .action-button, #shared-toolbar .object-picker, #shared-toolbar .background-picker { flex-shrink: 0; }
        #shared-toolbar .action-button { white-space: nowrap; }
        #shared-toolbar #exit-simple-mode { margin-left: auto; }

        #background-menu { max-width: calc(var(--page-width, 100vw) - 32px); }
        #menu-unlock-progress { top: calc(var(--page-height, 100vh) / 2); left: calc(var(--page-width, 100vw) / 2); }
        #page-scale { font: inherit; padding: 6px; border: 1px solid var(--menu-border); border-radius: 8px; color: var(--menu-ink); background: var(--menu-surface); }
        .play-settings { max-width: calc(var(--page-width, 100vw) - 32px); max-height: calc(var(--page-height, 100dvh) - 32px); }
    </style>
</head>

<body>
    <main id="balloons-view" class="simple-mode">
    <div id="background"></div>
    <div id="ground" aria-hidden="true" hidden></div>
    <canvas id="app"></canvas>

    <div class="overlay">
        <div class="card counter-card">
            <span class="counter-label" id="counter-label">Balloons</span>
            <span id="counter">0</span>
        </div>
        <div class="card counter-card timer-card" title="Play time remaining">
            <span class="counter-label">Play timer</span>
            <span id="play-timer" role="timer" aria-label="Play timer disabled">Off</span>
        </div>

        <div class="card reset-card">
            <a class="action-button sketch-button" href="#/sketchpad" aria-label="Open drawing canvas">
                <svg viewBox="0 0 24 24">
                    <path d="M12 19l-7 2 2-7L17 4a2.8 2.8 0 0 1 4 4L12 19Z" />
                    <path d="m15 6 3 3" />
                </svg>
                
            </a>
            <a class="action-button puzzle-button" href="#/puzzle" aria-label="Open picture puzzles" title="Puzzles">&#129513;</a>
            <a class="action-button matching-button" href="#/matching" aria-label="Open letter and number matching" title="Letters & numbers"><strong>ABC</strong></a>
            <div class="object-picker" id="object-picker">
                <button id="object-type" class="action-button" type="button" aria-label="Choose object type"
                    aria-haspopup="menu" aria-expanded="false" aria-controls="object-menu" title="Choose object type">
                    <img id="object-type-icon" src="/icons/objects/auto.svg" width="24" height="26" alt="">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="m2 3 3 3 3-3"/></svg>
                </button>
                <div id="object-menu" role="menu" aria-label="Object type" hidden>
                    <button type="button" role="menuitemradio" aria-checked="false" data-finish="auto" tabindex="-1">
                        <img src="/icons/objects/auto.svg" width="26" height="28" alt="">Auto
                    </button>
                    <button type="button" role="menuitemradio" aria-checked="false" data-finish="random" tabindex="-1">
                        <img src="/icons/objects/random.svg" width="26" height="28" alt="">Random per pointer
                    </button>
                    <button type="button" role="menuitemradio" aria-checked="false" data-finish="latex" tabindex="-1">
                        <img src="/icons/objects/latex.svg" width="26" height="28" alt="">Balloons
                    </button>
                    <button type="button" role="menuitemradio" aria-checked="false" data-finish="bubble" tabindex="-1">
                        <img src="/icons/objects/bubble.svg" width="26" height="28" alt="">Bubbles
                    </button>
                    <button type="button" role="menuitemradio" aria-checked="false" data-finish="hot-air" tabindex="-1">
                        <img src="/icons/objects/hot-air.svg" width="26" height="28" alt="">Hot air
                    </button>
                    <button type="button" role="menuitemradio" aria-checked="false" data-finish="paint" tabindex="-1">
                        <img src="/icons/objects/paint.svg" width="26" height="28" alt="">Paint balloons
                    </button>
                    <button type="button" role="menuitemradio" aria-checked="false" data-finish="duck" tabindex="-1">
                        <img src="/icons/objects/duck.svg" width="26" height="28" alt="">Rubber ducks
                    </button>
                    <button type="button" role="menuitemradio" aria-checked="false" data-finish="apple" tabindex="-1">
                        <img src="/icons/objects/apple.svg" width="26" height="28" alt="">Apples
                    </button>
                    <button type="button" role="menuitemradio" aria-checked="false" data-finish="watermelon" tabindex="-1">
                        <img src="/icons/objects/watermelon.svg" width="26" height="28" alt="">Watermelons
                    </button>
                </div>
            </div>
            <div class="background-picker">
                <button id="background-toggle" class="action-button" type="button" aria-label="Choose background"
                    title="Menu and settings" aria-expanded="false" aria-controls="background-menu">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
                        <path d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                    <span>Menu</span>
                </button>
                <div id="background-menu" role="dialog" aria-label="Scene background" hidden>
                    <section id="balloon-background-options"><h3>Background</h3>
                    <button type="button" data-background="auto">Automatic sky</button>
                    <div class="sky-options">
                        <button type="button" data-background="dawn"><img src="/backgrounds/dawn.webp" alt="">Dawn</button>
                        <button type="button" data-background="day"><img src="/backgrounds/day.webp" alt="">Day</button>
                        <button type="button" data-background="sunset"><img src="/backgrounds/sunset.webp" alt="">Sunset</button>
                        <button type="button" data-background="night"><img src="/backgrounds/night.webp" alt="">Night</button>
                    </div>
                    <button id="drawing-background" type="button" disabled>Use your drawing</button>
                    <button id="upload-background" type="button" style="display: none">Choose image?</button>
                    <small>Use a photo or a generated background.</small>
                    <button id="simple-mode" type="button">Simple mode</button>
                    </section>
                    <button id="app-update" type="button" hidden>Update available · Reload</button>
                    <span id="background-status" role="status"></span>
                </div>
                <input id="background-file" type="file" accept="image/png,image/jpeg,image/webp,image/avif,image/gif" hidden>
            </div>
            <button id="exit-simple-mode" class="action-button" type="button" aria-label="Collapse toolbar" aria-expanded="true" title="Collapse toolbar">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                    <path d="m15 6-6 6 6 6"/>
                </svg><span id="toolbar-collapse-label">Collapse</span>
            </button>
            <button id="reset" class="action-button" type="button">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 12a9 9 0 1 0 3-6.7" />
                    <path d="M3 3v6h6" />
                </svg>
                Reset
            </button>
        </div>
    </div>

    </main>
    <section id="sketchpad-view" aria-label="Sketchpad" hidden></section>
    <section id="puzzle-view" aria-label="Picture puzzles" hidden></section>
    <section id="matching-view" aria-label="Letter and number matching" hidden></section>
    <script src="/app.js"></script>
</body>

</html>
