<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="manifest" href="/manifest.webmanifest">

    <meta name="theme-color" content="#b8dcf5">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Balloons">


    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">

    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <link rel="icon" href="/favicon.ico">
    <title>Balloons</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        canvas {
            display: block;
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
            -webkit-user-select: none;
            background: transparent
        }

        #background {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        #app {
            position: fixed;
            inset: 0;
            z-index: 1;
            background: transparent;
        }


        .overlay {
            position: fixed;
            top: 16px;
            left: 16px;
            display: flex;
            align-items: stretch;
            flex-wrap: wrap;
            max-width: calc(100vw - 32px);
            gap: 10px;
            z-index: 10;
            /* pointer-events: none; */
            user-select: none;
        }

        .card {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 52px;
            padding: 10px 18px;

            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            border: 1px solid rgba(255, 255, 255, 0.65);
            border-radius: 14px;

            box-shadow:
                0 4px 16px rgba(30, 30, 60, 0.08),
                0 1px 3px rgba(30, 30, 60, 0.05);

            pointer-events: auto;
        }

        .counter-card {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            min-width: 110px;
            gap: 2px;
        }

        .counter-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #77768c;
        }

        #counter {
            font-size: 23px;
            font-weight: 750;
            line-height: 1.2;
            color: #4930b0;
            font-variant-numeric: tabular-nums;
        }

        .reset-card {
            gap: 5px;
            padding: 5px;
        }

        .action-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            height: 42px;
            padding: 0 18px;

            border: 0;
            border-radius: 10px;

            background: #6246ea;
            color: white;

            font: inherit;
            font-size: 13px;
            font-weight: 650;

            cursor: pointer;
            touch-action: manipulation;

            transition:
                background 150ms ease,
                transform 150ms ease,
                box-shadow 150ms ease;
        }

        .action-button:hover {
            background: #5134d4;
            box-shadow: 0 3px 10px rgba(98, 70, 234, 0.25);
        }

        .action-button:active {
            transform: scale(0.96);
        }

        .action-button:focus-visible {
            outline: 3px solid rgba(98, 70, 234, 0.35);
            outline-offset: 3px;
        }

        .object-picker { position: relative; }
        #object-type { padding: 0 10px; gap: 4px; }
        #object-type-icon { background: rgb(250, 250, 250); border-radius: 5px; }
        #object-menu {
            position: absolute;
            top: calc(100% + 10px);
            left: 0;
            min-width: 186px;
            padding: 6px;
            border: 1px solid #e4ddfa;
            border-radius: 14px;
            background: #fff;
            box-shadow: 0 8px 28px rgba(49, 27, 112, 0.2);
        }
        #object-menu[hidden] { display: none; }
        #object-menu button {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            min-height: 44px;
            padding: 8px 10px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: #4930b0;
            font: inherit;
            font-size: 13px;
            text-align: left;
            cursor: pointer;
        }
        #object-menu button:hover, #object-menu button:focus-visible { background: #f1edff; }
        #object-menu button:focus-visible { outline: 2px solid #6246ea; outline-offset: -2px; }
        #object-menu button[aria-checked="true"] { background: #e9e2ff; font-weight: 650; }
        #object-menu button[aria-checked="true"]::after { content: ''; margin-left: auto; width: 6px; height: 6px; border-radius: 50%; background: #6246ea; }

        .draw-button {
            display: grid;
            place-items: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.85);
            color: #7657ec;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
            text-decoration: none;
        }

        .sketch-button { text-decoration: none; }

        .sketch-button svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @media (max-width: 480px) {
            .overlay {
                top: 10px;
                left: 10px;
                gap: 8px;
            }

            .card {
                border-radius: 12px;
            }

            .counter-card {
                min-width: 95px;
                padding: 8px 12px;
            }
        }
    </style>
</head>

<body>
    <div id="background"></div>
    <canvas id="app"></canvas>

    <div class="overlay">
        <div class="card counter-card">
            <span class="counter-label" id="counter-label">Balloons</span>
            <span id="counter">0</span>
        </div>

        <div class="card reset-card">
            <a class="action-button sketch-button" href="https://sketchpad.anthonyjund.com" aria-label="Open drawing canvas">
                <svg viewBox="0 0 24 24">
                    <path d="M12 19l-7 2 2-7L17 4a2.8 2.8 0 0 1 4 4L12 19Z" />
                    <path d="m15 6 3 3" />
                </svg>
                
            </a>
            <div class="object-picker" id="object-picker">
                <button id="object-type" class="action-button" type="button" aria-label="Choose object type"
                    aria-haspopup="menu" aria-expanded="false" aria-controls="object-menu" title="Choose object type">
                    <img id="object-type-icon" src="/icons/objects/auto.svg" width="24" height="26" alt="">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="m2 3 3 3 3-3"/></svg>
                </button>
                <div id="object-menu" role="menu" aria-label="Object type" hidden>
                    <button type="button" role="menuitemradio" aria-checked="false" data-finish="auto" tabindex="-1">
                        <img src="/icons/objects/auto.svg" width="26" height="28" alt="">Auto
                    </button>
                    <button type="button" role="menuitemradio" aria-checked="false" data-finish="latex" tabindex="-1">
                        <img src="/icons/objects/latex.svg" width="26" height="28" alt="">Balloons
                    </button>
                    <button type="button" role="menuitemradio" aria-checked="false" data-finish="bubble" tabindex="-1">
                        <img src="/icons/objects/bubble.svg" width="26" height="28" alt="">Bubbles
                    </button>
                    <button type="button" role="menuitemradio" aria-checked="false" data-finish="hot-air" tabindex="-1">
                        <img src="/icons/objects/hot-air.svg" width="26" height="28" alt="">Hot air
                    </button>
                    <button type="button" role="menuitemradio" aria-checked="false" data-finish="paint" tabindex="-1">
                        <img src="/icons/objects/paint.svg" width="26" height="28" alt="">Paint balloons
                    </button>
                </div>
            </div>
            <button id="reset" class="action-button" type="button">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 12a9 9 0 1 0 3-6.7" />
                    <path d="M3 3v6h6" />
                </svg>
                Reset
            </button>
        </div>
    </div>

    <script src="/app.js"></script>
</body>

</html>
